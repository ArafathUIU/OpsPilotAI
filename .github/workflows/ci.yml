name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check .

      - name: Run Mypy Static Type Checking
        run: |
          mypy src tests apps simulator

  test-and-benchmark:
    name: Pytest & Multi-Agent Benchmark
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=src --cov=apps --cov=simulator --cov-report=xml --cov-report=term-missing

      - name: Run Benchmark Suite Smoke Test
        run: |
          python -m src.evaluation.runner --scenario redis_pool_exhaustion --output-dir reports/

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: reports/
